# Production override for compose.deploy.yml.
#
#   docker compose --env-file .env.production \
#     -f compose.deploy.yml -f compose.production.yml up -d --build
#
# Production config validation requires a 32+ character SECRET_KEY, secure
# cookies and no email redirection. Use scripts/preflight_env.py before deploy.
services:
  backend:
    environment:
      FASTAPI_ENV: production
      HSTS_ENABLED: ${HSTS_ENABLED:-true}
