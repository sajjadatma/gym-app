# Disposable CI stack: reuses the deployment services without Traefik.
# Required env: COMPOSE_PROJECT_NAME, BACKEND_IMAGE, POSTGRES_PASSWORD,
# SECRET_KEY, FIRST_SUPERUSER, FIRST_SUPERUSER_PASSWORD, DOMAIN, ACME_EMAIL.
services:
  proxy:
    profiles: ["proxy"]

  mailpit:
    image: axllent/mailpit:v1.31.4
    networks:
      - internal

  backend:
    depends_on:
      mailpit:
        condition: service_started
    environment:
      FASTAPI_ENV: development
      FRONTEND_HOST: http://localhost:8000
      COOKIE_SECURE: "false"
      HSTS_ENABLED: "false"
      TRUST_PROXY_HEADERS: "false"
      LOG_JSON: "false"
      SENTRY_ENVIRONMENT: ""
      EMAIL_REDIRECT_TO: ""
      RATE_LIMIT_ENABLED: "false"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      EMAILS_FROM_EMAIL: no-reply@gymapp.example.com
      EMAILS_FROM_NAME: Gym Management
    ports:
      - "8000:8000"

  db:
    ports:
      - "5433:5432"
