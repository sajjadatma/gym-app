name: CI

# Release gates for MVP1.
#
# backend/frontend are fast static/unit gates. docker-e2e builds the real image,
# starts it with PostgreSQL, checks startup/migrations/restart/config failure,
# runs critical Playwright journeys and PWA smoke, then proves backup/restore.
# No deploy or hosting steps are included.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  env-contract:
    name: env-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate local environment examples
        run: python3 scripts/check-env-examples.py

  local-environments:
    name: local-environments
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Prepare isolated dev and stage databases
        run: |
          cp .env.dev.example .env.dev
          cp .env.stage.example .env.stage
          uv run --project backend python scripts/bootstrap-local.py --env dev --no-seed
          uv run --project backend python scripts/bootstrap-local.py --env stage --no-seed
      - name: Prove both databases exist
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -tAc             "select count(*) from pg_database where datname in ('gym_dev','gym_stage')"             | grep -qx 2

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gym_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gym_app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-only-secret-key-not-for-production
      FIRST_SUPERUSER: ci-superuser@example.com
      FIRST_SUPERUSER_PASSWORD: ci-only-superuser-password
      # TEST_DATABASE_URL drives the pytest fixture and the migration smoke
      # test derives its disposable gym_app_migration_test database from it.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gym_app
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gym_app_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Ruff
        working-directory: backend
        run: uv run ruff check app tests
      - name: Mypy
        working-directory: backend
        run: uv run mypy app
      - name: Workflow security lint
        run: uv run zizmor .github/workflows
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Build frontend shell for static-serving tests
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Pytest (excluding migration smoke test)
        working-directory: backend
        run: uv run pytest -q -m "not migrations"
      - name: Alembic migration smoke test
        working-directory: backend
        run: uv run pytest -q -m migrations

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Biome
        working-directory: frontend
        run: bun run lint:check
      - name: TypeScript
        working-directory: frontend
        run: bunx tsc -p tsconfig.build.json --noEmit
      - name: Build
        working-directory: frontend
        run: bun run build

  docker-e2e:
    name: docker-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [backend, frontend]
    env:
      COMPOSE_PROJECT_NAME: gym-ci
      BACKEND_IMAGE: gym-app-ci:${{ github.sha }}
      POSTGRES_PASSWORD: ci-postgres-password
      SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
      FIRST_SUPERUSER: ci-superuser@example.com
      FIRST_SUPERUSER_PASSWORD: ci-only-superuser-password
      DOMAIN: localhost
      ACME_EMAIL: ci@example.com
      ACME_CA_SERVER: https://acme-staging-v02.api.letsencrypt.org/directory
      PLAYWRIGHT_SUPERUSER_EMAIL: ci-superuser@example.com
      PLAYWRIGHT_SUPERUSER_PASSWORD: ci-only-superuser-password
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        working-directory: frontend
        run: bunx playwright install --with-deps chromium
      - name: Build image and start stack
        run: bash scripts/ci/start-stack.sh
      - name: Verify restart, config failure and concurrent migrations
        run: bash scripts/ci/verify-stack.sh
      - name: Critical Playwright journeys
        run: bash scripts/ci/run-playwright.sh critical
      - name: Production PWA smoke
        run: bash scripts/ci/run-playwright.sh pwa
      - name: Backup and isolated restore drill
        run: bash scripts/ci/backup-restore-drill.sh
      - name: Compose logs on failure
        if: failure()
        run: docker compose -f compose.deploy.yml -f compose.ci.yml logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose -f compose.deploy.yml -f compose.ci.yml down -v
