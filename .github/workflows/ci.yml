name: CI

# Minimal hardening gates for MVP1 (HARD-03).
#
# Playwright is intentionally excluded: the suite needs a running backend, the
# Vite dev/preview server, seeded demo data and a browser image. That is a
# separate, heavier integration environment, not part of this minimal gate.
# No deploy or hosting steps are included.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gym_app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gym_app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-only-secret-key-not-for-production
      FIRST_SUPERUSER: ci-superuser@example.com
      FIRST_SUPERUSER_PASSWORD: ci-only-superuser-password
      # TEST_DATABASE_URL drives the pytest fixture and the migration smoke
      # test derives its disposable gym_app_migration_test database from it.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gym_app
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gym_app_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Ruff
        working-directory: backend
        run: uv run ruff check app tests
      - name: Mypy
        working-directory: backend
        run: uv run mypy app
      - name: Pytest (excluding migration smoke test)
        working-directory: backend
        run: uv run pytest -q -m "not migrations"
      - name: Alembic migration smoke test
        working-directory: backend
        run: uv run pytest -q -m migrations

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Biome
        working-directory: frontend
        run: bun run lint:check
      - name: TypeScript
        working-directory: frontend
        run: bunx tsc -p tsconfig.build.json --noEmit
      - name: Build
        working-directory: frontend
        run: bun run build
