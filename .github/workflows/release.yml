name: Release candidate

# Build once, run the full release suite against that exact image, then publish
# the same image. Deployment is manual and documented in
# docs/release/production-deployment-runbook.md. This workflow never deploys.

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push the tested image to GHCR"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  release-candidate:
    name: release-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: gym-release
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
      BACKEND_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
      POSTGRES_PASSWORD: ci-postgres-password
      SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
      FIRST_SUPERUSER: ci-superuser@example.com
      FIRST_SUPERUSER_PASSWORD: ci-only-superuser-password
      DOMAIN: localhost
      ACME_EMAIL: ci@example.com
      ACME_CA_SERVER: https://acme-staging-v02.api.letsencrypt.org/directory
      PLAYWRIGHT_SUPERUSER_EMAIL: ci-superuser@example.com
      PLAYWRIGHT_SUPERUSER_PASSWORD: ci-only-superuser-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Install Playwright Chromium
        working-directory: frontend
        run: bunx playwright install --with-deps chromium
      - name: Build release image
        run: docker build --pull --file backend/Dockerfile --tag "$IMAGE" .
      - name: Start stack with the tested image
        env:
          NO_BUILD: "1"
        run: bash scripts/ci/start-stack.sh
      - name: Verify restart, config failure and concurrent migrations
        run: bash scripts/ci/verify-stack.sh
      - name: Full Playwright suite
        run: bash scripts/ci/run-playwright.sh full
      - name: Production PWA smoke
        run: bash scripts/ci/run-playwright.sh pwa
      - name: Backup and isolated restore drill
        run: bash scripts/ci/backup-restore-drill.sh
      - name: Compose logs on failure
        if: failure()
        run: docker compose -f compose.deploy.yml -f compose.ci.yml logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose -f compose.deploy.yml -f compose.ci.yml down -v
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/') || inputs.push_image
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Publish tested image
        if: startsWith(github.ref, 'refs/tags/') || inputs.push_image
        run: |
          docker push "$IMAGE"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            docker tag "$IMAGE" "ghcr.io/$GITHUB_REPOSITORY:$GITHUB_REF_NAME"
            docker push "ghcr.io/$GITHUB_REPOSITORY:$GITHUB_REF_NAME"
          fi
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE" || true)"
          {
            echo "### Release image"
            echo ""
            echo "- source commit: \`$GITHUB_SHA\`"
            echo "- tested image: \`$IMAGE\`"
            echo "- digest: \`$digest\`"
            echo "- deployment: manual (see production runbook)"
          } >> "$GITHUB_STEP_SUMMARY"
